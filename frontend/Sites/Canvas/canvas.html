<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../CSS_Libraries/base.css">
</head>
<body>
    <header>
        <a href="../../index.html" id="header-icon-link"><img src="../../Images/Icons/home.png" alt="home" id="header-icon"></a>
        <div id="toolbar">
            <a href="../Login/login.html" class="toolbarButton">Logowanie</a>
            <a href="../Register/register.html" class="toolbarButton">Rejestracja</a>
        </div>
    </header>

    <main>
        <section>
            <div id="toolbox">
                <div class="tool" data-selected="true" data-tool-name="pencil"><img src="../../Images/Icons/pencil.png" alt="pencil"></div>
                <div class="tool" data-selected="false" data-tool-name="eraser"><img src="../../Images/Icons/eraser.png" alt="eraser"></div>
                <div class="tool" data-selected="false" data-tool-name="temp"></div>
                <div id="tool-size">
                    <input type="range" orient="vertical" id="slider" min="1" max="20" value="10" step="1">
                    <h1 id="slider-label"></h1>
                </div>
            </div>
            <canvas id="main-canvas"></canvas>
            <div id="other">
                <div class="tool"><img src="../../Images/Icons/pencil.png" alt="pencil"></div>
            </div>
        </section>
    </main>

    <script src="canvas.js"></script>
</body>
</html>
