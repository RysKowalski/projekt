<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie</title>
    <link rel="stylesheet" href="CSS_Libraries/base.css">
    <link rel="stylesheet" href="CSS_Libraries/forms.css">
</head>
<body>
    <header>
        <a href="index.html" id="header-icon-link"><img src="Images/Icons/home.png" alt="home" id="header-icon"></a>
        <div id="toolbar">
            <a href="login.html" class="toolbarButton">Logowanie</a>
            <a href="register.html" class="toolbarButton">Rejestracja</a>
        </div>
    </header>

    <section>
        <!-- w action wstawić skrypt -->
        <form id="formBox" action="" method="post"> 
            <h1>Logowanie</h1>

            <div class="formInput">
                <img src="Images/Icons/user.png" alt="login">
                <input type="text" placeholder="Login" class="textInput" id="username">
            </div>

            <div class="formInput">
                <img src="Images/Icons/keylock.png" alt="login">
                <input type="password" placeholder="Hasło" class="textInput" id="password">
            </div>

            <div id="extras">
                <h3>Nie masz jeszcze konta? <a href="register.html">Zarejestruj się</a></h3>
                <h3 id="errorMessage"></h3>
            </div>

            <input type="submit" value="Zaloguj się" id="submit"></input>
        </form>
    </section>

    <script src="login.js"></script>
</body>
</html>
